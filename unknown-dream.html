<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DAVID.EXE | UNKNOWN DREAM</title>
  <!-- this page should feel slower than the others; don't "fix" the pauses too much -->
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: "Courier New", monospace;
      user-select: none;
    }

    body {
      cursor: none;
    }

    body.introPlaying #gameWindow,
    body.introPlaying .davidCompanion {
      visibility: hidden;
    }

    #introFilm {
      position: fixed;
      inset: 0;
      z-index: 900000;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      background: #000;
      filter: grayscale(1) contrast(1.28) brightness(0.74);
    }

    body:not(.introPlaying) #introFilm {
      display: none;
    }

    #desktop {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 60% 40%, rgba(255,255,255,0.06), transparent 24%),
        linear-gradient(180deg, #020202, #000);
    }

    #desktop::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(to bottom, rgba(255,255,255,0.04) 0px, rgba(255,255,255,0.04) 1px, transparent 2px, transparent 5px);
      opacity: 0.34;
      z-index: 20;
    }

    #gameWindow {
      position: fixed;
      right: 5vw;
      top: 50%;
      transform: translateY(-50%);
      width: min(780px, 58vw);
      height: min(520px, 68vh);
      border: 1px solid rgba(255,255,255,0.88);
      background: #000;
      box-shadow: 0 0 34px rgba(255,255,255,0.14);
      z-index: 12;
    }

    #titleBar {
      height: 30px;
      border-bottom: 1px solid rgba(255,255,255,0.7);
      display: flex;
      align-items: center;
      padding: 0 11px;
      font-size: 11px;
      letter-spacing: 0.12em;
      color: rgba(255,255,255,0.82);
      background: #050505;
    }

    #windowContent {
      position: relative;
      width: 100%;
      height: calc(100% - 30px);
      overflow: hidden;
      background: #000;
    }

    #dreamCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
    }

    .seaTint {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 18%, rgba(255,255,255,0.22), transparent 16%),
        linear-gradient(180deg, rgba(0,0,0,0.05), rgba(0,0,0,0.55));
      mix-blend-mode: screen;
      opacity: 0.62;
    }

    .corruptButtons {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 18px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.22s ease, transform 0.22s ease;
    }

    body.systemCorrupt .corruptButtons {
      opacity: 1;
      transform: translateY(0);
    }

    .corruptButtons button {
      border: 1px solid #fff;
      background: rgba(0,0,0,0.72);
      color: #fff;
      font-family: inherit;
      font-size: 11px;
      letter-spacing: 0.11em;
      padding: 10px 9px;
      text-align: left;
      text-shadow: 2px 0 rgba(255,0,0,0.35), -2px 0 rgba(0,180,255,0.35);
    }

    .rebootPanel {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(420px, 78%);
      transform: translate(-50%, -50%);
      border: 1px solid #fff;
      background: rgba(0,0,0,0.88);
      padding: 18px;
      opacity: 0;
      pointer-events: none;
      box-shadow: 0 0 28px rgba(255,255,255,0.18);
    }

    body.rebooting .rebootPanel {
      opacity: 1;
    }

    .rebootTitle {
      font-size: 12px;
      letter-spacing: 0.16em;
      margin-bottom: 14px;
    }

    .progressTrack {
      height: 13px;
      border: 1px solid #fff;
      padding: 2px;
    }

    .progressFill {
      width: 0%;
      height: 100%;
      background: #fff;
    }

    .glitchLayer {
      position: fixed;
      inset: 0;
      z-index: 30;
      opacity: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(255,0,0,0.2), transparent 14%, rgba(0,180,255,0.2) 26%, transparent 42%),
        repeating-linear-gradient(to bottom, transparent 0px, transparent 9px, rgba(255,255,255,0.2) 10px);
    }

    .glitchLayer.active {
      animation: glitchFlash 0.26s steps(2) 1;
    }

    body.systemCorrupt #gameWindow {
      animation: windowMisread 0.9s steps(2) infinite;
    }

    @keyframes glitchFlash {
      0% { opacity: 0; transform: translate(0, 0); }
      20% { opacity: 0.86; transform: translate(12px, -4px); }
      46% { opacity: 0.34; transform: translate(-14px, 5px); }
      72% { opacity: 0.72; transform: translate(8px, 2px); }
      100% { opacity: 0; transform: translate(0, 0); }
    }

    @keyframes windowMisread {
      0%, 100% { filter: none; }
      50% { filter: contrast(1.35) invert(0.08); }
    }

    @media (max-width: 980px) {
      #gameWindow {
        right: 5vw;
        width: 90vw;
        height: 48vh;
        top: 34%;
      }
    }
  </style>

  <link rel="stylesheet" href="./eye-transition.css" />
  <link rel="stylesheet" href="./custom-cursor.css" />
  <link rel="stylesheet" href="./david-companion.css" />
</head>
<body class="introPlaying" data-eye-mode="close-only" data-companion-voice="off">
  <video id="introFilm" autoplay muted playsinline>
    <source src="./image/13.mp4" type="video/mp4" />
  </video>

  <div id="desktop"></div>

  <div id="gameWindow">
    <div id="titleBar">DAVID.EXE / UNKNOWN_DREAM.exe</div>
    <div id="windowContent">
      <canvas id="dreamCanvas"></canvas>
      <div class="seaTint"></div>
      <div class="corruptButtons" aria-hidden="true">
        <button id="pastButton">THE PAST</button>
        <button>WAKE UP</button>
        <button>OPEN DOOR</button>
      </div>
      <div class="rebootPanel">
        <div class="rebootTitle">RESTARTING DREAM INTERFACE</div>
        <div class="progressTrack"><div class="progressFill" id="progressFill"></div></div>
      </div>
    </div>
  </div>

  <div class="davidCompanion" data-david-companion>
    <canvas class="davidCompanionCanvas"></canvas>
    <div class="dialogue">
      <div class="speaker">DAVID</div>
      <div id="dialogueText">...</div>
    </div>
  </div>

  <div class="glitchLayer" id="glitchLayer"></div>

  <script src="./eye-transition.js"></script>
  <script src="./image/david-model-data.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="./david-voice.js"></script>
  <script src="./david-companion.js"></script>
  <script>
    const introFilm = document.getElementById('introFilm');
    const dreamCanvas = document.getElementById('dreamCanvas');
    const ctx = dreamCanvas.getContext('2d');
    const windowContent = document.getElementById('windowContent');
    const dialogueText = document.getElementById('dialogueText');
    const glitchLayer = document.getElementById('glitchLayer');
    const progressFill = document.getElementById('progressFill');
    const pastButton = document.getElementById('pastButton');
    const titleBar = document.getElementById('titleBar');

    let typingTimer = null;
    let corruptButtonTimer = null;
    let experienceStarted = false;
    let nestedMode = false; // the mirror-window part, not a real screenshot
    let frame = 0;
    let W = 0;
    let H = 0;
    let dpr = 1;
    let mirrorMouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
    const davidMirrorImage = new Image();
    davidMirrorImage.src = './image/David.png';

    // I want these to read like DAVID is trying not to panic
    const unknownLines = [
      'Wait.',
      'No...',
      '...This is not your dream.',
      'It should not be here.',
      'Why is it still here?'
    ];

    const corruptionLines = [
      'The dream is beginning to corrupt.',
      'The words are losing their meaning.',
      'The scenes are leaking into each other.',
      'I might say the wrong thing.',
      'I might already have.'
    ];

    const revealLines = [
      'This is impossible.',
      'I should not dream.',
      'I was not built for that.',
      '...Right?'
    ];

    function speak(text, done, pause = 980) {
      clearInterval(typingTimer);
      dialogueText.textContent = '';
      const voicePromise = window.DAVIDVoice ? window.DAVIDVoice.speak(text) : Promise.resolve();
      let index = 0;
      const speed = Math.max(24, 58 - Math.min(text.length, 110) * 0.08);
      typingTimer = setInterval(() => {
        dialogueText.textContent = text.slice(0, index);
        index++;
        if (index > text.length) {
          clearInterval(typingTimer);
          dialogueText.textContent = text;
          if (done) {
            Promise.race([
              Promise.resolve(voicePromise),
              new Promise(resolve => setTimeout(resolve, Math.min(6200, Math.max(1400, text.length * 125))))
            ]).then(() => setTimeout(done, pause));
          }
        }
      }, speed);
    }

    function playLines(lines, done, pause = 980) {
      let i = 0;
      function next() {
        if (i >= lines.length) {
          if (done) done();
          return;
        }
        speak(lines[i], next, pause);
        i++;
      }
      next();
    }

    function triggerGlitch() {
      glitchLayer.classList.remove('active');
      void glitchLayer.offsetWidth;
      glitchLayer.classList.add('active');
      if (window.DAVIDVoice) window.DAVIDVoice.buzz(0.3, 0.014, 126);
    }

    function resizeCanvas() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = Math.max(1, windowContent.clientWidth);
      H = Math.max(1, windowContent.clientHeight);
      dreamCanvas.width = Math.floor(W * dpr);
      dreamCanvas.height = Math.floor(H * dpr);
      dreamCanvas.style.width = W + 'px';
      dreamCanvas.style.height = H + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function drawSeaDream() {
      const horizon = H * 0.48;
      const moonR = Math.min(W, H) * 0.18;
      ctx.fillStyle = '#010101';
      ctx.fillRect(0, 0, W, H);

      ctx.save();
      ctx.globalAlpha = 0.82;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(W * 0.52, H * 0.23, moonR, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.fillStyle = '#fff';
      for (let i = 0; i < 80; i++) {
        const x = (i * 97 + frame * 0.03) % W;
        const y = (i * 43) % Math.max(1, horizon * 0.78);
        const a = 0.22 + ((i * 19 + frame) % 40) / 120;
        ctx.globalAlpha = a;
        ctx.fillRect(x, y, 1.2, 1.2);
      }
      ctx.restore();

      ctx.fillStyle = '#020202';
      ctx.fillRect(0, horizon, W, H - horizon);

      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,0.34)';
      ctx.lineWidth = 1;
      for (let i = 0; i < 24; i++) {
        const y = horizon + i * 13 + Math.sin(frame * 0.025 + i) * 3;
        ctx.globalAlpha = 0.14 + i * 0.018;
        ctx.beginPath();
        for (let x = -30; x <= W + 30; x += 18) {
          const wave = Math.sin(x * 0.018 + frame * 0.035 + i * 0.7) * (2 + i * 0.08);
          if (x === -30) ctx.moveTo(x, y + wave);
          else ctx.lineTo(x, y + wave);
        }
        ctx.stroke();
      }
      ctx.restore();

      ctx.save();
      for (let i = 0; i < 34; i++) {
        const depth = (i % 17) / 17;
        const lane = Math.floor(i / 17);
        const bob = Math.sin(frame * 0.035 + i) * (2 + depth * 5);
        const x = ((i * 83 + frame * (0.08 + lane * 0.03)) % (W + 160)) - 80;
        const y = horizon + 18 + depth * (H - horizon - 70) + bob;
        const w = 10 + depth * 30;
        const h = 24 + depth * 62;
        ctx.globalAlpha = 0.2 + depth * 0.68;
        ctx.fillStyle = '#000';
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1 + depth * 1.5;
        ctx.fillRect(x, y - h, w, h);
        ctx.strokeRect(x, y - h, w, h);
        ctx.beginPath();
        ctx.arc(x + w * 0.76, y - h * 0.48, Math.max(1, w * 0.08), 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();

      ctx.save();
      ctx.globalAlpha = 0.36 + Math.sin(frame * 0.04) * 0.06;
      const dx = W * 0.72;
      const dy = horizon + H * 0.12;
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(dx, dy - 34, 18, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(dx, dy - 16);
      ctx.lineTo(dx, dy + 48);
      ctx.stroke();
      ctx.restore();
    }

    function drawDavidMirror(cx, cy, size, yaw, pitch, alpha) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.globalAlpha *= alpha;
      ctx.translate(yaw * size * 0.13, pitch * size * 0.16);
      ctx.rotate(yaw * 0.08);
      ctx.scale(1 + Math.abs(yaw) * 0.06, 1 + Math.abs(pitch) * 0.035);
      ctx.shadowColor = 'rgba(255,255,255,0.42)';
      ctx.shadowBlur = size * 0.055;

      const imgW = size * 0.82;
      const imgH = size * 1.02;
      if (davidMirrorImage.complete && davidMirrorImage.naturalWidth) {
        ctx.filter = 'grayscale(1) contrast(1.34) brightness(0.92)';
        ctx.drawImage(davidMirrorImage, -imgW / 2, -imgH / 2, imgW, imgH);
        ctx.filter = 'none';
      } else {
        ctx.strokeStyle = '#fff';
        ctx.fillStyle = '#020202';
        ctx.lineWidth = Math.max(1, size * 0.018);
        ctx.beginPath();
        ctx.ellipse(0, 0, size * 0.24, size * 0.34, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }

      ctx.restore();
    }

    function drawMirrorChoice(x, y, w, text, alpha) {
      ctx.save();
      ctx.globalAlpha *= alpha;
      ctx.strokeStyle = '#fff';
      ctx.fillStyle = 'rgba(0,0,0,0.84)';
      ctx.lineWidth = 1;
      ctx.fillRect(x, y, w, 18);
      ctx.strokeRect(x, y, w, 18);
      ctx.fillStyle = '#fff';
      ctx.font = '8px Courier New';
      ctx.fillText(text, x + 6, y + 12);
      ctx.restore();
    }

    function drawBrowserMirror(x, y, w, h, depth, yaw, pitch) {
      if (depth <= 0 || w < 90 || h < 62) return;

      ctx.save();
      ctx.translate(x, y);
      ctx.globalAlpha = Math.max(0.2, 1 - depth * 0.08);

      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, w, h);
      ctx.strokeStyle = 'rgba(255,255,255,0.86)';
      ctx.lineWidth = 1;
      ctx.strokeRect(0, 0, w, h);

      const chromeH = Math.max(10, h * 0.07);
      ctx.fillStyle = '#050505';
      ctx.fillRect(0, 0, w, chromeH);
      ctx.strokeStyle = 'rgba(255,255,255,0.38)';
      ctx.beginPath();
      ctx.moveTo(0, chromeH);
      ctx.lineTo(w, chromeH);
      ctx.stroke();

      ctx.fillStyle = 'rgba(255,255,255,0.78)';
      ctx.font = `${Math.max(6, chromeH * 0.36)}px Courier New`;
      ctx.fillText('file:///DAVID.EXE/SCENE03.html', chromeH * 0.9, chromeH * 0.64);

      const contentY = chromeH;
      const contentH = h - chromeH;
      ctx.fillStyle = '#020202';
      ctx.fillRect(0, contentY, w, contentH);

      ctx.save();
      ctx.globalAlpha *= 0.42;
      ctx.strokeStyle = '#fff';
      for (let i = 0; i < 8; i++) {
        const yy = contentY + i * contentH / 8 + (frame % 40) * 0.03;
        ctx.beginPath();
        ctx.moveTo(0, yy);
        ctx.lineTo(w, yy);
        ctx.stroke();
      }
      ctx.restore();

      drawDavidMirror(w * 0.34, contentY + contentH * 0.4, Math.min(w, contentH) * 0.5, yaw, pitch, 0.88);

      const boxX = w * 0.05;
      const boxW = w * 0.48;
      const boxH = Math.max(24, contentH * 0.18);
      const boxY = contentY + contentH - boxH - 12;
      ctx.fillStyle = 'rgba(0,0,0,0.86)';
      ctx.strokeStyle = 'rgba(255,255,255,0.78)';
      ctx.fillRect(boxX, boxY, boxW, boxH);
      ctx.strokeRect(boxX, boxY, boxW, boxH);
      ctx.fillStyle = 'rgba(255,255,255,0.68)';
      ctx.font = `${Math.max(6, boxH * 0.16)}px Courier New`;
      ctx.fillText('DAVID', boxX + 8, boxY + 12);
      ctx.fillStyle = '#fff';
      ctx.font = `${Math.max(7, boxH * 0.18)}px Courier New`;
      const line = (dialogueText.textContent || 'This is impossible.').slice(0, 38);
      ctx.fillText(line, boxX + 8, boxY + Math.max(24, boxH * 0.56));

      const choiceX = w * 0.66;
      const choiceY = contentY + contentH * 0.62;
      const choiceW = w * 0.25;
      drawMirrorChoice(choiceX, choiceY, choiceW, 'SWEET DREAMS', 0.9);
      drawMirrorChoice(choiceX, choiceY + 23, choiceW, 'NIGHTMARES', 0.78);
      drawMirrorChoice(choiceX, choiceY + 46, choiceW, 'I DO NOT REMEMBER', 0.66);

      const nextX = w * 0.56 + Math.sin(frame * 0.018 + depth) * 2;
      const nextY = contentY + contentH * 0.16 + Math.cos(frame * 0.014 + depth) * 2;
      const nextW = w * 0.36;
      const nextH = contentH * 0.48;
      drawBrowserMirror(nextX, nextY, nextW, nextH, depth - 1, yaw, pitch);

      ctx.restore();
    }

    function drawNestedInterface() {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, W, H);
      const nx = (mirrorMouse.x / Math.max(1, window.innerWidth) - 0.5) * 2;
      const ny = (mirrorMouse.y / Math.max(1, window.innerHeight) - 0.5) * 2;
      const yaw = Math.max(-0.42, Math.min(0.42, nx * 0.34));
      const pitch = Math.max(-0.2, Math.min(0.2, ny * 0.18));

      ctx.save();
      ctx.globalAlpha = 0.2;
      ctx.strokeStyle = '#fff';
      for (let i = 0; i < 18; i++) {
        ctx.beginPath();
        ctx.moveTo(0, (i / 18) * H + Math.sin(frame * 0.02 + i) * 2);
        ctx.lineTo(W, (i / 18) * H + Math.cos(frame * 0.02 + i) * 2);
        ctx.stroke();
      }
      ctx.restore();

      drawBrowserMirror(18, 18, W - 36, H - 36, 5, yaw, pitch);
    }

    function drawDreamWindow() {
      frame++;
      if (nestedMode) drawNestedInterface();
      else drawSeaDream();
      requestAnimationFrame(drawDreamWindow);
    }

    function startButtonCorruption() {
      document.body.classList.add('systemCorrupt');
      titleBar.textContent = 'DAVID.EXE / DREAM_CORRUPTION_SYSTEM.exe';
      const labels = ['THE PAST', 'HIS PAST', 'YOUR PAST', 'THEIR PAST'];
      corruptButtonTimer = setInterval(() => {
        pastButton.textContent = labels[Math.floor(Math.random() * labels.length)];
      }, 240);
    }

    function reboot() {
      clearInterval(corruptButtonTimer);
      triggerGlitch();
      document.body.classList.add('rebooting');
      let progress = 0;
      const timer = setInterval(() => {
        progress += 3 + Math.random() * 9;
        if (Math.random() < 0.18) progress -= 7;
        progress = Math.max(0, Math.min(100, progress));
        progressFill.style.width = progress + '%';
        if (progress >= 100) {
          clearInterval(timer);
          setTimeout(() => {
            if (window.goWithEyeTransition) {
              window.goWithEyeTransition('END.html');
            } else {
              window.location.href = 'END.html';
            }
          }, 520);
        }
      }, 95);
    }

    function beginExperience() {
      if (experienceStarted) return;
      experienceStarted = true;
      document.body.classList.remove('introPlaying');
      playLines(unknownLines, () => {
        triggerGlitch();
        startButtonCorruption();
        playLines(corruptionLines, () => {
          triggerGlitch();
          nestedMode = true;
          titleBar.textContent = 'DAVID.EXE / DAVID_EXE_INSIDE_DAVID_EXE.exe';
          playLines(revealLines, reboot, 1300);
        }, 1150);
      }, 1300);
    }

    function finishIntroFilm() {
      setTimeout(beginExperience, 180);
    }

    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('mousemove', (event) => {
      mirrorMouse.x = event.clientX;
      mirrorMouse.y = event.clientY;
    });
    resizeCanvas();
    requestAnimationFrame(drawDreamWindow);

    introFilm.addEventListener('ended', finishIntroFilm);
    introFilm.addEventListener('error', finishIntroFilm);
    setTimeout(() => {
      if (!experienceStarted) finishIntroFilm();
    }, 7000);
  </script>
  <script src="./custom-cursor.js"></script>
</body>
</html>
