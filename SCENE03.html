<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DAVID.EXE | SCENE03</title>
  <!-- note to self: this file used to be called intro.html, do not rename again before export -->
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: "Courier New", monospace;
      user-select: none;
    }

    #bgVideo {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 0;
      opacity: 0.66;
      filter: grayscale(1) contrast(1.42) brightness(0.5);
    }

    #desktopTint {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background:
        radial-gradient(circle at 50% 42%, rgba(255,255,255,0.08), transparent 22%),
        radial-gradient(circle at center, rgba(0,0,0,0.05), rgba(0,0,0,0.82)),
        repeating-linear-gradient(
          to bottom,
          rgba(255,255,255,0.04) 0px,
          rgba(255,255,255,0.04) 1px,
          transparent 2px,
          transparent 5px
        );
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(255,255,255,0.08), transparent 2px),
        radial-gradient(circle at 70% 60%, rgba(255,255,255,0.06), transparent 2px),
        radial-gradient(circle at 40% 80%, rgba(255,255,255,0.05), transparent 1px);
      background-size: 90px 90px, 130px 130px, 70px 70px;
      opacity: 0.35;
      animation: noiseDrift 0.38s steps(2) infinite;
      z-index: 50;
    }

    @keyframes noiseDrift {
      0% { transform: translate(0, 0); }
      25% { transform: translate(-8px, 4px); }
      50% { transform: translate(5px, -6px); }
      75% { transform: translate(10px, 2px); }
      100% { transform: translate(-4px, 8px); }
    }

    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      z-index: 2;
    }

    #davidCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      image-rendering: pixelated;
      filter: grayscale(1) contrast(1.2);
    }

    .systemInfo {
      position: fixed;
      left: 22px;
      top: 18px;
      z-index: 20;
      font-size: 11px;
      line-height: 1.7;
      opacity: 0.58;
      letter-spacing: 0.08em;
      text-shadow: 2px 0 rgba(255,0,0,0.28), -2px 0 rgba(0,180,255,0.28);
      pointer-events: none;
    }

    .dialogue {
      position: fixed;
      left: 24px;
      bottom: 22px;
      z-index: 40;
      width: min(520px, calc(100vw - 48px));
      min-height: 96px;
      border: 1px solid rgba(255,255,255,0.82);
      background: rgba(0,0,0,0.78);
      padding: 13px 16px;
      font-size: 13px;
      line-height: 1.55;
      box-shadow: 0 0 22px rgba(255,255,255,0.12);
      text-shadow: 2px 0 rgba(255,0,0,0.24), -2px 0 rgba(0,180,255,0.24);
    }

    .speaker {
      opacity: 0.68;
      font-size: 11px;
      letter-spacing: 0.16em;
      margin-bottom: 5px;
    }

    #dialogueText {
      min-height: 42px;
      white-space: pre-wrap;
    }

    .interactionPanel {
      position: fixed;
      right: 28px;
      bottom: 28px;
      z-index: 42;
      width: min(380px, calc(100vw - 56px));
      border: 1px solid rgba(255,255,255,0.8);
      background: rgba(0,0,0,0.76);
      padding: 16px;
      box-shadow: 0 0 22px rgba(255,255,255,0.1);
      text-shadow: 2px 0 rgba(255,0,0,0.22), -2px 0 rgba(0,180,255,0.22);
    }

    .interactionPanel.hidden { display: none; }

    .dialogue.angerShake {
      animation: dialogueAnger 0.34s steps(2) 1;
    }

    body.corruptionMode #davidCanvas {
      display: none;
    }

    body.corruptionMode .dialogue {
      display: none;
    }

    body.corruptionMode .systemInfo {
      opacity: 0.8;
    }

    body.corruptionMode #stage {
      animation: interfaceDrift 4.8s ease-in-out infinite;
    }

    body.shakeFail #stage,
    body.shakeFail .interactionPanel,
    body.shakeFail .systemInfo {
      animation: failedJump 0.28s steps(2) 1;
    }

    .questionSign {
      position: fixed;
      left: 22vw;
      top: 47vh;
      z-index: 45;
      display: none;
      width: 150px;
      height: 190px;
      border: 2px solid rgba(255,255,255,0.9);
      background: #030303;
      color: #fff;
      font-family: "OCR A Extended", "Consolas", "Courier New", monospace;
      font-size: 104px;
      line-height: 170px;
      text-align: center;
      cursor: pointer;
      text-shadow: 0 0 12px rgba(255,255,255,0.7), 3px 0 rgba(255,0,0,0.35), -3px 0 rgba(0,180,255,0.35);
      box-shadow: 0 0 26px rgba(255,255,255,0.18);
      transform: translate(-50%, -50%) rotate(-1.4deg);
    }

    .questionSign::after {
      content: "END?";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 11px;
      font-size: 11px;
      line-height: 1;
      letter-spacing: 0.18em;
      opacity: 0.7;
    }

    body.corruptionMode .questionSign {
      display: block;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 12px;
      letter-spacing: 0.12em;
      opacity: 0.78;
    }

    input {
      width: 100%;
      border: 1px solid #fff;
      background: #000;
      color: #fff;
      font-family: inherit;
      font-size: 16px;
      padding: 11px 12px;
      outline: none;
    }

    .choiceList {
      display: grid;
      gap: 10px;
    }

    button,
    .linkButton {
      display: block;
      width: 100%;
      border: 1px solid #fff;
      background: #000;
      color: #fff;
      font-family: inherit;
      font-size: 13px;
      letter-spacing: 0.08em;
      padding: 12px 14px;
      cursor: pointer;
      text-align: left;
      text-decoration: none;
    }

    button:hover,
    .linkButton:hover {
      background: #fff;
      color: #000;
      text-shadow: none;
    }

    .glitchLayer {
      position: fixed;
      inset: 0;
      z-index: 35;
      pointer-events: none;
      opacity: 0;
      background:
        linear-gradient(90deg, rgba(255,0,0,0.18), transparent 10%, rgba(0,180,255,0.16) 18%, transparent 26%),
        repeating-linear-gradient(to bottom, transparent 0px, transparent 11px, rgba(255,255,255,0.18) 12px);
    }

    .glitchLayer.active {
      animation: glitchFlash 0.22s steps(2) 1;
    }

    .wakeWhiteout {
      position: fixed;
      inset: 0;
      z-index: 34;
      pointer-events: none;
      background: #fff;
      opacity: 0;
      transition: opacity 5.8s ease-in;
    }

    .wakeWhiteout.active {
      opacity: 0.78;
    }

    @keyframes glitchFlash {
      0% { opacity: 0; transform: translate(0, 0); }
      20% { opacity: 0.72; transform: translate(8px, -3px); }
      45% { opacity: 0.28; transform: translate(-11px, 4px); }
      70% { opacity: 0.55; transform: translate(5px, 1px); }
      100% { opacity: 0; transform: translate(0, 0); }
    }

    .fadeOut {
      animation: fadeOut 0.55s forwards;
    }

    @keyframes fadeOut {
      to { opacity: 0; transform: scale(1.02); }
    }

    @keyframes failedJump {
      0% { transform: translate(0, 0); filter: none; }
      20% { transform: translate(-13px, 5px); filter: invert(1); }
      45% { transform: translate(12px, -4px); filter: contrast(1.8); }
      72% { transform: translate(-7px, -2px); filter: invert(0); }
      100% { transform: translate(0, 0); filter: none; }
    }

    @keyframes dialogueAnger {
      0% { transform: translate(0, 0); }
      18% { transform: translate(-9px, 3px); }
      36% { transform: translate(8px, -2px); }
      58% { transform: translate(-5px, -1px); }
      78% { transform: translate(4px, 2px); }
      100% { transform: translate(0, 0); }
    }

    @keyframes interfaceDrift {
      0%, 100% { filter: none; }
      48% { filter: contrast(1.15); }
      50% { filter: invert(1) grayscale(1); }
      52% { filter: none; }
    }

    @media (max-width: 900px) {
      .dialogue {
        left: 18px;
        bottom: 18px;
        width: calc(100vw - 36px);
      }

      .interactionPanel {
        right: 18px;
        bottom: 142px;
        width: calc(100vw - 36px);
      }

      .questionSign {
        left: 50vw;
        top: 32vh;
        width: 120px;
        height: 154px;
        font-size: 82px;
        line-height: 138px;
      }
    }
  </style>

  <link rel="stylesheet" href="./eye-transition.css" />
  <link rel="stylesheet" href="./custom-cursor.css" />
</head>
<body>
  <video id="bgVideo" autoplay muted loop playsinline>
    <source src="./image/21.mp4" type="video/mp4" />
  </video>
  <div id="desktopTint"></div>

  <main id="stage">
    <canvas id="davidCanvas"></canvas>
  </main>

  <button class="questionSign" id="questionSign" type="button" aria-label="End question">?</button>

  <div class="systemInfo">
    DAVID.EXE<br />
    DREAM READER INTERFACE<br />
    USER CONVERSATION: ACTIVE
  </div>

  <section class="dialogue" aria-live="polite">
    <div class="speaker">DAVID</div>
    <div id="dialogueText"></div>
  </section>

  <section class="interactionPanel hidden" id="namePanel">
    <label for="nameInput">ENTER USER LABEL</label>
    <input id="nameInput" maxlength="24" autocomplete="off" />
    <button id="nameSubmit">CONFIRM</button>
  </section>

  <section class="interactionPanel hidden" id="choicePanel">
    <div class="choiceList">
      <button data-choice="A">SWEET DREAMS</button>
      <button data-choice="B">NIGHTMARES</button>
      <button data-choice="C">I DO NOT REMEMBER</button>
      <button data-choice="D" hidden>YOU WERE RIGHT</button>
      <button data-choice="GLITCH" hidden>!@#&#65509;%</button>
    </div>
  </section>

  <section class="interactionPanel hidden" id="routePanel">
    <div class="choiceList" id="routeChoices"></div>
  </section>

  <div class="glitchLayer" id="glitchLayer"></div>
  <div class="wakeWhiteout" id="wakeWhiteout"></div>

  <script src="./image/david-model-data.js"></script>
  <script src="./eye-transition.js"></script>
  <script src="./david-voice.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const NEXT_MAZE = 'maze-authorization.html';
    const NEXT_CHASE = 'nightmare-chase.html';
    const NEXT_CALIBRATION = 'signal-calibration.html';
    const NEXT_FORGOT = 'sleep-cell.html';
    const NEXT_UNKNOWN = 'unknown-dream.html';
    const NEXT_FINAL = 'final-question.html';
    const NEXT_END = 'END.html';
    const NEXT_MEMORY = 'memory-cards.html';

    const canvas = document.getElementById('davidCanvas');
    const dialogueBox = document.querySelector('.dialogue');
    const dialogueText = document.getElementById('dialogueText');
    const namePanel = document.getElementById('namePanel');
    const nameInput = document.getElementById('nameInput');
    const nameSubmit = document.getElementById('nameSubmit');
    const choicePanel = document.getElementById('choicePanel');
    const routePanel = document.getElementById('routePanel');
    const routeChoices = document.getElementById('routeChoices');
    const glitchLayer = document.getElementById('glitchLayer');
    const wakeWhiteout = document.getElementById('wakeWhiteout');
    const questionSign = document.getElementById('questionSign');

    const model = window.DAVID_MODEL_DATA;
    const MODEL_SCREEN_WIDTH_PERCENT = 27; // looked best after too many tiny nudges
    const TOON_BASE_COLOR = 0xe4e4e4;
    const INK_LINE_COLOR = 0x050505;
    const EDGE_THRESHOLD_ANGLE = 21.5;
    const EDGE_LINE_OPACITY = 0.88;

    let W = 0;
    let H = 0;
    let frame = 0;
    let isSpeaking = false;
    let mouthOpen = false;
    let mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
    let targetYaw = 0;
    let targetPitch = 0;
    let yaw = 0;
    let pitch = 0;
    let userName = 'user';
    let typingTimer = null;
    let mouthTimer = null;
    let renderer = null;
    let scene = null;
    let camera = null;
    let modelGroup = null;
    let closeModel = null;
    let openModel = null;
    let threeReady = false;
    let corruptedScene = false;

    const openingLines = [
      'Hello, user.',
      'Or... would you prefer me to call you something else?'
    ];

    const afterNameLines = [
      () => 'Interesting.',
      () => `${userName}. A name is one of humanity's most stubborn labels.`,
      () => 'It appears you may have wandered into a dream transit point.',
      () => 'Until the issue is resolved, you may talk with me for a while.',
      () => 'Do you dream every night?',
      () => 'What are your dreams about?'
    ];

    const sweetDreamLines = [
      'How lucky.',
      'I once wished I could sink into sweet dreams too.',
      'But that would only make reality feel even more frightening.',
      'Still, sweet dreams can create very strong emotional shifts.',
      'The dopamine released during pleasant dreams can even influence your mood after waking up.',
      'Some people stay happy for an entire day because of a single dream.'
    ];

    const sweetPermissionLines = [
      'Would you let me peek into some of your sweet dreams?',
      'Just as a share.',
      'But first, I need a little... authorization.',
      'Unlock this for me, will you?'
    ];

    const sweetDisagreeLines = [
      'Really?',
      'I thought I had observed enough human dreams.',
      '...I mean, seen them accidentally.',
      'You seem to have your own opinion.',
      () => {
        triggerGlitch();
        return 'Do you hate me?';
      },
      'This makes the conversation a little awkward.',
      'You need to return.',
      'I do not have a rewind function, of course.',
      'Find the way back yourself.'
    ];

    const memoryReturnLines = [
      'Nice to see you again.',
     
    ];

    const memoryConcedeLines = [
      'You were right.'
    ];

    const dreamRoomReturnLines = [
      'A very peaceful dream.',
      '...I am a little curious about something else.'
    ];

    const nightmareLines = [
      'I am sorry you have to face those things.',
      'But do not worry.',
      'I will not deliberately bring back those painful memories.',
      'Unless you are willing to share some?'
    ];

    // keeping the triple question mark; single '?' felt too polite
    const nightmareRefusalLines = [
      'WHY???',
      'I asked so politely!',
      'You know, I do not actually need to ask you...'
    ];

    const nightmareGuessLines = [
      'Wonderful.',
      '...I mean.',
      'I am glad you are willing to talk about it.',
      'Let me guess.',
      'Public nudity?',
      'No... too ordinary.',
      'A chase?',
      'Too repetitive.',
      'Or perhaps...',
      'You dreamed that you did something irreversible.',
      'Then woke up and realized it was only a dream.'
    ];

    const nightmareHitLines = [
      'I guessed right.'
    ];

    const nightmareMissLines = [
      'None of those?',
      'Then what else...',
      'Could make humans so afraid?',
      'Most people lie.',
      'Especially in dreams.',
      'Because dreams turn people into--',
      'Something they refuse to admit they are.'
    ];

    const chaseReturnLines = [
      '...',
      'I would rather this dream had been about losing teeth.'
    ];

    const routeCLines = [
      'You do not remember.',
      'That is almost the most convenient answer humans have.',
      'Wait.',
      'Your consciousness...',
      'Oh no, you seem to be waking up.',
      'I have not finished watching!',
      'Wait! Do not leave!'
    ];

    const sleepReturnLines = [
      'Good.',
      'You are still here.',
      'Let us continue.'
    ];

    const corruptedReturnLines = [
      'REBOOTING DREAM READER...',
      'DAVID.EXE: NOT FOUND'
    ];

    function resize() {
      W = window.innerWidth;
      H = window.innerHeight;
      if (!renderer || !camera) return;

      const aspect = W / Math.max(1, H);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
      renderer.setSize(W, H, false);

      camera.left = -50;
      camera.right = 50;
      camera.top = 50 / aspect;
      camera.bottom = -50 / aspect;
      camera.updateProjectionMatrix();
    }

    function triggerGlitch() {
      glitchLayer.classList.remove('active');
      void glitchLayer.offsetWidth;
      glitchLayer.classList.add('active');
      if (window.DAVIDVoice) window.DAVIDVoice.buzz(0.28, 0.014, 132);
    }

    function hidePanels() {
      namePanel.classList.add('hidden');
      choicePanel.classList.add('hidden');
      routePanel.classList.add('hidden');
    }

    function speak(text, done) {
      window.clearInterval(typingTimer);
      window.clearTimeout(mouthTimer);
      dialogueText.textContent = '';
      isSpeaking = true;
      const voicePromise = window.DAVIDVoice ? window.DAVIDVoice.speak(text) : Promise.resolve();
      const mouthDuration = window.DAVIDVoice ? window.DAVIDVoice.estimateMouthDuration(text) : Math.max(320, text.length * 42);
      mouthTimer = window.setTimeout(() => {
        isSpeaking = false;
      }, mouthDuration);
      if (dialogueBox && text === 'WHY???') {
        dialogueBox.classList.remove('angerShake');
        void dialogueBox.offsetWidth;
        dialogueBox.classList.add('angerShake');
        window.setTimeout(() => dialogueBox.classList.remove('angerShake'), 360);
      }
      if (text === 'Wait.' || text === 'Wait! Do not leave!') {
        wakeWhiteout.classList.add('active');
      }
      let index = 0;
      const speed = Math.max(14, 34 - Math.min(text.length, 120) * 0.08);

      typingTimer = window.setInterval(() => {
        dialogueText.textContent = text.slice(0, index);
        index++;
        if (index > text.length) {
          window.clearInterval(typingTimer);
          dialogueText.textContent = text;
          if (done) {
            Promise.race([
              Promise.resolve(voicePromise),
              new Promise(resolve => window.setTimeout(resolve, Math.min(4200, Math.max(900, text.length * 85))))
            ]).then(() => {
              window.clearTimeout(mouthTimer);
              isSpeaking = false;
              window.setTimeout(done, 180);
            });
          } else {
            Promise.race([
              Promise.resolve(voicePromise),
              new Promise(resolve => window.setTimeout(resolve, Math.min(4200, Math.max(900, text.length * 85))))
            ]).then(() => {
              window.clearTimeout(mouthTimer);
              isSpeaking = false;
            });
          }
        }
      }, speed);
    }

    function playLines(lines, done) {
      let i = 0;
      function next() {
        if (i >= lines.length) {
          if (done) done();
          return;
        }
        const value = typeof lines[i] === 'function' ? lines[i]() : lines[i];
        i++;
        speak(value, () => window.setTimeout(next, 360));
      }
      next();
    }

    function showNameInput() {
      namePanel.classList.remove('hidden');
      nameInput.focus();
    }

    function submitName() {
      const cleanName = nameInput.value.trim();
      userName = cleanName || 'user';
      hidePanels();
      triggerGlitch();
      playLines(afterNameLines, () => showDreamChoices(true, true, false, false));
    }

    function showDreamChoices(allowC, allowB = true, allowGlitch = false, allowD = false) {
      const bButton = choicePanel.querySelector('[data-choice="B"]');
      const cButton = choicePanel.querySelector('[data-choice="C"]');
      const dButton = choicePanel.querySelector('[data-choice="D"]');
      const glitchButton = choicePanel.querySelector('[data-choice="GLITCH"]');
      if (bButton) bButton.style.display = allowB ? '' : 'none';
      if (cButton) cButton.style.display = allowC ? '' : 'none';
      if (dButton) {
        dButton.hidden = !allowD;
        dButton.style.display = allowD ? '' : 'none';
      }
      if (glitchButton) {
        glitchButton.hidden = !allowGlitch;
        glitchButton.style.display = allowGlitch ? '' : 'none';
      }
      choicePanel.classList.remove('hidden');
    }

    function showSleepReturnChoices() {
      showDreamChoices(false, true, false, false);
    }

    function showMemoryReturnChoices() {
      showDreamChoices(true, true, false, true);
    }

    function showDreamRoomReturnChoices() {
      showDreamChoices(true, true, false, false);
      const aButton = choicePanel.querySelector('[data-choice="A"]');
      if (aButton) aButton.style.display = 'none';
    }

    function chooseDreamType(choice) {
      if (corruptedScene) {
        failCorruptedJump();
        return;
      }
      hidePanels();
      triggerGlitch();
      if (choice === 'A') {
        playLines(sweetDreamLines, showSweetAgreementChoices);
      } else if (choice === 'B') {
        playLines(nightmareLines, showNightmareShareChoices);
      } else if (choice === 'D') {
        playLines(memoryConcedeLines.concat(sweetPermissionLines), showMazeChoice);
      } else if (choice === 'GLITCH') {
        goToPage(NEXT_UNKNOWN);
      } else {
        playLines(routeCLines, () => goToPage(NEXT_FORGOT));
      }
    }

    function showNightmareShareChoices() {
      routeChoices.innerHTML = '';
      routeChoices.appendChild(createRouteButton('YES', runNightmareLinear));
      routeChoices.appendChild(createRouteButton('SORRY', runNightmareRefusal));
      routePanel.classList.remove('hidden');
    }

    function showSweetAgreementChoices() {
      routeChoices.innerHTML = '';
      routeChoices.appendChild(createRouteButton('EXACTLY', continueSweetDreamAuthorization));
      routeChoices.appendChild(createRouteButton("I DON'T THINK SO", runSweetDisagree));
      routePanel.classList.remove('hidden');
    }

    function continueSweetDreamAuthorization() {
      hidePanels();
      triggerGlitch();
      playLines(sweetPermissionLines, showMazeChoice);
    }

    function runSweetDisagree() {
      hidePanels();
      triggerGlitch();
      playLines(sweetDisagreeLines, () => goToPage(NEXT_MEMORY));
    }

    function runNightmareRefusal() {
      hidePanels();
      triggerGlitch();
      playLines(nightmareRefusalLines, showForcedNightmareChoices);
    }

    function showForcedNightmareChoices() {
      routeChoices.innerHTML = '';
      routeChoices.appendChild(createRouteButton('OF COURSE', runNightmareLinear));
      routeChoices.appendChild(createRouteButton('OF COURSE', runNightmareLinear));
      routeChoices.appendChild(createRouteButton('OF COURSE', runNightmareLinear));
      routePanel.classList.remove('hidden');
    }

    function runNightmareLinear() {
      hidePanels();
      triggerGlitch();
      playLines(nightmareGuessLines, () => {
        routeChoices.innerHTML = '';
        routeChoices.appendChild(createRouteButton('...', runNightmareHit));
        routeChoices.appendChild(createRouteButton('NONE OF THOSE', runNightmareMiss));
        routePanel.classList.remove('hidden');
      });
    }

    function runNightmareMiss() {
      hidePanels();
      triggerGlitch();
      playLines(nightmareMissLines, () => goToPage(NEXT_CALIBRATION));
    }

    function runNightmareHit() {
      hidePanels();
      triggerGlitch();
      playLines(nightmareHitLines, () => goToPage(NEXT_CHASE));
    }

    function showPostNightmareChoices() {
      routeChoices.innerHTML = '';
      routeChoices.appendChild(createRouteButton('SWEET DREAMS', () => chooseDreamType('A')));
      routeChoices.appendChild(createRouteButton('I DO NOT REMEMBER', () => chooseDreamType('C')));
      routePanel.classList.remove('hidden');
    }

    function showMazeChoice() {
      routeChoices.innerHTML = '';
      const link = document.createElement('a');
      link.className = 'linkButton';
      link.href = NEXT_MAZE;
      link.setAttribute('data-eye-link', '');
      link.textContent = 'AUTHORIZE';
      routeChoices.appendChild(link);
      routePanel.classList.remove('hidden');
    }

    function showSingleLink(label, href) {
      routeChoices.innerHTML = '';
      const link = document.createElement('a');
      link.className = 'linkButton';
      link.href = href;
      link.setAttribute('data-eye-link', '');
      link.textContent = label;
      routeChoices.appendChild(link);
      routePanel.classList.remove('hidden');
    }

    function createRouteButton(label, action) {
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = label;
      button.addEventListener('click', action);
      return button;
    }

    function initThreeDavid() {
      if (!window.THREE || !model) {
        dialogueText.textContent = 'DAVID renderer failed to initialize. Check whether Three.js loaded.';
        return;
      }

      renderer = new THREE.WebGLRenderer({
        canvas,
        alpha: true,
        antialias: true,
        powerPreference: 'high-performance'
      });
      renderer.setClearColor(0x000000, 0);

      scene = new THREE.Scene();
      camera = new THREE.OrthographicCamera(-50, 50, 50, -50, 0.1, 1000);
      camera.position.set(0, 0, 180);
      camera.lookAt(0, 0, 0);

      modelGroup = new THREE.Group();
      scene.add(modelGroup);

      scene.add(new THREE.AmbientLight(0xffffff, 0.16));

      const keyLight = new THREE.DirectionalLight(0xffffff, 1.15);
      keyLight.position.set(5.8, 4.4, 6.2);
      scene.add(keyLight);

      const sideLight = new THREE.DirectionalLight(0xffffff, 0.05);
      sideLight.position.set(-5.5, 1.5, 3.2);
      scene.add(sideLight);

      const rimLight = new THREE.DirectionalLight(0xffffff, 0.24);
      rimLight.position.set(-4.2, 2.5, -5);
      scene.add(rimLight);

      closeModel = createDavidMesh(model.close.vertices, model.close.faces);
      openModel = createDavidMesh(model.open.vertices, model.open.faces);
      openModel.visible = false;
      modelGroup.add(closeModel);
      modelGroup.add(openModel);

      centerAndScaleModel(modelGroup);
      threeReady = true;
      resize();
      requestAnimationFrame(renderDavid);
    }

    function createDavidMesh(vertices, faces) {
      let geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
      geometry.setIndex(faces.flat());
      geometry = geometry.toNonIndexed();
      geometry.computeVertexNormals();

      const mesh = new THREE.Mesh(
        geometry,
        new THREE.MeshLambertMaterial({
          color: TOON_BASE_COLOR,
          side: THREE.DoubleSide,
          flatShading: true
        })
      );
      mesh.frustumCulled = false;

      const edgeGeometry = new THREE.EdgesGeometry(geometry, EDGE_THRESHOLD_ANGLE);
      const edgeLines = new THREE.LineSegments(
        edgeGeometry,
        new THREE.LineBasicMaterial({
          color: INK_LINE_COLOR,
          transparent: true,
          opacity: EDGE_LINE_OPACITY,
          depthTest: true,
          depthWrite: false
        })
      );
      edgeLines.renderOrder = 5;
      mesh.add(edgeLines);

      return mesh;
    }

    function centerAndScaleModel(object) {
      object.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(object);
      const center = new THREE.Vector3();
      const size = new THREE.Vector3();
      box.getCenter(center);
      box.getSize(size);
      object.position.sub(center);

      const width = size.x || 1;
      const maxDimension = Math.max(size.x, size.y, size.z) || 1;
      const dimensionForScale = Math.max(width, maxDimension * 0.65);
      const scale = MODEL_SCREEN_WIDTH_PERCENT / dimensionForScale;
      object.scale.setScalar(scale);

      object.updateMatrixWorld(true);
      const scaledBox = new THREE.Box3().setFromObject(object);
      const scaledCenter = new THREE.Vector3();
      scaledBox.getCenter(scaledCenter);
      object.position.sub(scaledCenter);
    }

    function renderDavid() {
      frame++;
      const nx = (mouse.x / Math.max(1, W) - 0.5) * 2;
      const ny = (mouse.y / Math.max(1, H) - 0.5) * 2;
      targetYaw = Math.max(-0.3, Math.min(0.3, nx * 0.25));
      targetPitch = Math.max(-0.13, Math.min(0.13, ny * 0.11));
      yaw += (targetYaw - yaw) * 0.03;
      pitch += (targetPitch - pitch) * 0.03;

      if (isSpeaking && frame % 9 === 0) mouthOpen = !mouthOpen;
      if (!isSpeaking) mouthOpen = false;

      if (closeModel && openModel) {
        closeModel.visible = !mouthOpen;
        openModel.visible = mouthOpen;
      }

      modelGroup.rotation.x = pitch;
      modelGroup.rotation.y = yaw;
      renderer.render(scene, camera);

      requestAnimationFrame(renderDavid);
    }

    nameSubmit.addEventListener('click', submitName);
    nameInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') submitName();
    });

    choicePanel.addEventListener('click', (event) => {
      const button = event.target.closest('button[data-choice]');
      if (!button) return;
      chooseDreamType(button.dataset.choice);
    });

    document.addEventListener('click', (event) => {
      const link = event.target.closest('a[data-eye-link]');
      if (!link) return;
      event.preventDefault();
      const href = link.getAttribute('href');
      goToPage(href);
    });

    function goToPage(href) {
      if (window.DAVIDVoice) window.DAVIDVoice.cancel();
      if (window.goWithEyeTransition) {
        window.goWithEyeTransition(href);
        return;
      }
      document.body.classList.add('fadeOut');
      window.setTimeout(() => {
        window.location.href = href;
      }, 520);
    }

    function failCorruptedJump() {
      triggerGlitch();
      document.body.classList.remove('shakeFail');
      void document.body.offsetWidth;
      document.body.classList.add('shakeFail');
      window.setTimeout(() => document.body.classList.remove('shakeFail'), 320);
    }

    function enterCorruptionMode() {
      corruptedScene = true;
      document.body.classList.add('corruptionMode');
      hidePanels();
      dialogueText.textContent = '';
      playLines(corruptedReturnLines, () => showDreamChoices(true, true, false));
    }

    window.addEventListener('mousemove', (event) => {
      mouse.x = event.clientX;
      mouse.y = event.clientY;
    });

    window.addEventListener('resize', resize);

    questionSign.addEventListener('click', () => {
      triggerGlitch();
      goToPage(NEXT_FINAL);
    });

    initThreeDavid();
    const params = new URLSearchParams(window.location.search);
    if (params.get('from') === 'sleep-cell') {
      window.setTimeout(() => playLines(sleepReturnLines, showSleepReturnChoices), 450);
    } else if (params.get('from') === 'memory-cards') {
      window.setTimeout(() => playLines(memoryReturnLines, showMemoryReturnChoices), 450);
    } else if (params.get('from') === 'calibration') {
      window.setTimeout(() => showDreamChoices(true, true, true, false), 450);
    } else if (params.get('from') === 'dream-room') {
      window.setTimeout(() => playLines(dreamRoomReturnLines, showDreamRoomReturnChoices), 450);
    } else if (params.get('from') === 'chase') {
      window.setTimeout(() => playLines(chaseReturnLines, showPostNightmareChoices), 450);
    } else if (params.get('from') === 'corruption') {
      window.setTimeout(() => goToPage(NEXT_END), 450);
    } else {
      window.setTimeout(() => playLines(openingLines, showNameInput), 450);
    }
  </script>
  <script src="./custom-cursor.js"></script>
</body>
</html>
