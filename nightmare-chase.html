<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DAVID.EXE | Nightmare Window</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: "Courier New", monospace;
      user-select: none;
    }

    #bgVideo {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 0;
      opacity: 0.68;
      filter: grayscale(1) contrast(1.45) brightness(0.5);
    }

    #desktopTint {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background:
        radial-gradient(circle at center, rgba(0,0,0,0.12), rgba(0,0,0,0.76)),
        repeating-linear-gradient(
          to bottom,
          rgba(255,255,255,0.04) 0px,
          rgba(255,255,255,0.04) 1px,
          transparent 2px,
          transparent 5px
        );
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(255,255,255,0.08), transparent 2px),
        radial-gradient(circle at 70% 60%, rgba(255,255,255,0.06), transparent 2px),
        radial-gradient(circle at 40% 80%, rgba(255,255,255,0.05), transparent 1px);
      background-size: 90px 90px, 130px 130px, 70px 70px;
      opacity: 0.36;
      animation: noiseDrift 0.38s steps(2) infinite;
      z-index: 50;
    }

    @keyframes noiseDrift {
      0% { transform: translate(0, 0); }
      25% { transform: translate(-8px, 4px); }
      50% { transform: translate(5px, -6px); }
      75% { transform: translate(10px, 2px); }
      100% { transform: translate(-4px, 8px); }
    }

    #desktop {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      z-index: 2;
    }

    #gameWindow {
      position: absolute;
      left: auto;
      right: 4vw;
      top: 50%;
      transform: translateY(-50%);
      width: min(clamp(620px, 56vw, 920px), calc(100vw - 48px));
      aspect-ratio: 16 / 10;
      min-width: 0;
      border: 1px solid rgba(255,255,255,0.9);
      background: #000;
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.95),
        0 0 42px rgba(255,255,255,0.16),
        12px 16px 0 rgba(0,0,0,0.45);
      z-index: 10;
    }

    #titleBar {
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.86);
      background: linear-gradient(to right, #111, #050505);
      padding: 0 10px;
      cursor: default;
      text-shadow: 2px 0 rgba(255,0,0,0.35), -2px 0 rgba(0,180,255,0.35);
    }

    .windowTitle {
      font-size: 13px;
      letter-spacing: 0.12em;
      white-space: nowrap;
    }

    #windowContent {
      position: relative;
      width: 100%;
      height: calc(100% - 34px);
      overflow: hidden;
      background: radial-gradient(circle at center, #111 0%, #030303 44%, #000 100%);
    }

    #windowContent::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(255,255,255,0.04) 0px,
          rgba(255,255,255,0.04) 1px,
          transparent 2px,
          transparent 5px
        );
      opacity: 0.6;
      z-index: 25;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      filter: contrast(1.18) grayscale(1);
    }

    .hud {
      display: none;
    }

    .hud h1 {
      margin: 0 0 8px;
      font-size: 14px;
      letter-spacing: 0.13em;
      font-weight: normal;
    }

    .line {
      font-size: 12px;
      line-height: 1.45;
      opacity: 0.88;
    }

    .freeze {
      position: absolute;
      inset: 0;
      z-index: 40;
      display: grid;
      place-items: center;
      opacity: 0;
      background: rgba(0,0,0,0.88);
      pointer-events: none;
      transition: opacity 0.08s linear;
    }

    .freeze.active { opacity: 1; }

    .freezeBox {
      border: 1px solid #fff;
      padding: 18px 24px;
      background: #000;
      font-size: 14px;
      letter-spacing: 0.16em;
      text-align: center;
      box-shadow: 0 0 30px rgba(255,255,255,0.14);
    }

    .glitchLayer {
      position: absolute;
      inset: 0;
      z-index: 31;
      pointer-events: none;
      opacity: 0;
      background:
        linear-gradient(90deg, rgba(255,0,0,0.2), transparent 10%, rgba(0,180,255,0.18) 18%, transparent 26%),
        repeating-linear-gradient(to bottom, transparent 0px, transparent 11px, rgba(255,255,255,0.2) 12px);
    }

    .glitchLayer.active {
      animation: glitchFlash 0.22s steps(2) 1;
    }

    @keyframes glitchFlash {
      0% { opacity: 0; transform: translate(0, 0); }
      20% { opacity: 0.78; transform: translate(7px, -2px); }
      45% { opacity: 0.32; transform: translate(-10px, 3px); }
      70% { opacity: 0.58; transform: translate(5px, 1px); }
      100% { opacity: 0; transform: translate(0, 0); }
    }

    .fadeOut {
      animation: fadeOut 0.5s forwards;
    }

    @keyframes fadeOut {
      to { opacity: 0; transform: scale(1.02); }
    }

    @media (max-width: 900px) {
      #gameWindow {
        width: 88vw;
        right: 6vw;
        top: 50%;
      }
    }
  </style>

  <link rel="stylesheet" href="./eye-transition.css" />
  <link rel="stylesheet" href="./custom-cursor.css" />
  <link rel="stylesheet" href="./david-companion.css" />
</head>
<body>
  <video id="bgVideo" autoplay muted loop playsinline>
    <source src="./image/21.mp4" type="video/mp4" />
  </video>
  <div id="desktopTint"></div>

  <div id="desktop">
    <div id="gameWindow">
      <div id="titleBar">
        <div class="windowTitle">DAVID.EXE / NIGHTMARE_WINDOW.exe</div>
      </div>

      <div id="windowContent">
        <canvas id="dreamCanvas"></canvas>
        <div class="hud">
          <h1>&gt; DREAM WINDOW / PLAYBACK</h1>
          <div class="line">[ FIRST PERSON RUNNING SCENE ]</div>
          <div class="line">[ FOOTSTEPS: ACCELERATING ]</div>
          <div class="line">[ DISTANT PRESENCE: APPROACHING ]</div>
        </div>
        <div id="freeze" class="freeze">
          <div class="freezeBox">WINDOW FORCE-CLOSED</div>
        </div>
        <div class="glitchLayer" id="glitchLayer"></div>
      </div>
    </div>
  </div>

  <div class="davidCompanion" data-david-companion>
    <canvas class="davidCompanionCanvas"></canvas>
    <div class="dialogue">
      <div class="speaker">DAVID</div>
      <div id="dialogueText">hummm.</div>
    </div>
  </div>

  <script src="./eye-transition.js"></script>
  <script src="./image/david-model-data.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="./david-voice.js"></script>
  <script src="./david-companion.js"></script>
  <script>
    const canvas = document.getElementById('dreamCanvas');
    const ctx = canvas.getContext('2d');
    const freeze = document.getElementById('freeze');
    const glitchLayer = document.getElementById('glitchLayer');
    const dialogueText = document.getElementById('dialogueText');
    const windowContent = document.getElementById('windowContent');

    let W = 0;
    let H = 0;
    let dpr = 1;
    let frame = 0;
    let speed = 0;
    let frozen = false;
    let startedAt = performance.now();
    let humStarted = false;

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = windowContent.clientWidth;
      H = windowContent.clientHeight;
      canvas.width = Math.floor(W * dpr);
      canvas.height = Math.floor(H * dpr);
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function draw() {
      if (frozen) return;
      if (!humStarted && window.DAVIDVoice) {
        humStarted = true;
        window.DAVIDVoice.startHum(6.4, 0.024);
      }
      frame++;
      const elapsed = performance.now() - startedAt;
      speed = Math.min(1, elapsed / 6200);

      const shake = speed * 14;
      const jitterX = (Math.random() - 0.5) * shake;
      const jitterY = (Math.random() - 0.5) * shake;
      const horizon = H * (0.42 + Math.sin(frame * 0.08) * 0.015);
      const cx = W * 0.5 + jitterX;

      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, W, H);

      ctx.save();
      ctx.translate(jitterX, jitterY);

      ctx.strokeStyle = 'rgba(255,255,255,0.42)';
      ctx.lineWidth = 1;
      for (let i = 0; i < 18; i++) {
        const t = ((frame * (0.012 + speed * 0.06) + i / 18) % 1);
        const y = horizon + Math.pow(t, 2.25) * H * 0.9;
        const half = 22 + Math.pow(t, 2.1) * W * 0.85;
        ctx.globalAlpha = 0.15 + t * 0.75;
        ctx.beginPath();
        ctx.moveTo(cx - half, y);
        ctx.lineTo(cx + half, y);
        ctx.stroke();
      }

      for (let side = -1; side <= 1; side += 2) {
        for (let i = 0; i < 16; i++) {
          const t = ((frame * (0.018 + speed * 0.075) + i / 16) % 1);
          const y = horizon + Math.pow(t, 2.35) * H * 0.95;
          const x = cx + side * (40 + Math.pow(t, 2.1) * W * 0.62);
          const height = 18 + t * H * 0.7;
          ctx.globalAlpha = 0.2 + t * 0.75;
          ctx.strokeStyle = '#fff';
          ctx.beginPath();
          ctx.moveTo(x, y - height);
          ctx.lineTo(x + side * (18 + t * 60), y + height * 0.28);
          ctx.stroke();
        }
      }

      const presence = Math.min(1, Math.max(0, (elapsed - 1700) / 4200));
      ctx.globalAlpha = 0.12 + presence * 0.55 + Math.sin(frame * 0.24) * 0.08;
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2 + presence * 5;
      ctx.beginPath();
      ctx.arc(cx, horizon - 28 + presence * 20, 18 + presence * 86, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(cx, horizon - 8 + presence * 40);
      ctx.lineTo(cx, horizon + 42 + presence * 150);
      ctx.stroke();

      ctx.restore();
      ctx.globalAlpha = 1;

      if (Math.random() < 0.24) {
        ctx.globalAlpha = 0.08 + Math.random() * 0.16;
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, Math.random() * H, W, 1 + Math.random() * 5);
      }

      if (elapsed > 6600) forceClose();
      requestAnimationFrame(draw);
    }

    function forceClose() {
      if (frozen) return;
      frozen = true;
      if (window.DAVIDVoice) window.DAVIDVoice.stopHum();
      dialogueText.textContent = '...';
      triggerGlitch();
      freeze.classList.add('active');
      setTimeout(() => {
        if (window.goWithEyeTransition) {
          window.goWithEyeTransition('SCENE03.html?from=chase');
        } else {
          document.body.classList.add('fadeOut');
          setTimeout(() => {
            window.location.href = 'SCENE03.html?from=chase';
          }, 520);
        }
      }, 1450);
    }

    function triggerGlitch() {
      glitchLayer.classList.remove('active');
      void glitchLayer.offsetWidth;
      glitchLayer.classList.add('active');
      if (window.DAVIDVoice) window.DAVIDVoice.buzz(0.32, 0.014, 122);
    }

    window.addEventListener('resize', resize);

    resize();
    requestAnimationFrame(draw);
  </script>
  <script src="./custom-cursor.js"></script>
</body>
</html>
