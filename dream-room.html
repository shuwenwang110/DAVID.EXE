<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DAVID.EXE | DREAM ROOM</title>
  <!-- TODO: maybe replace the TV emojis with real little drawings if there is time -->
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: "Courier New", monospace;
      user-select: none;
    }

    body {
      cursor: none;
    }

    #desktop {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 72% 20%, rgba(255,255,255,0.06), transparent 18%),
        linear-gradient(180deg, #050505, #000);
    }

    #desktop::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(to bottom, rgba(255,255,255,0.035) 0px, rgba(255,255,255,0.035) 1px, transparent 2px, transparent 5px);
      opacity: 0.4;
      z-index: 30;
    }

    #gameWindow {
      position: fixed;
      right: 5vw;
      top: 50%;
      transform: translateY(-50%);
      width: min(780px, 58vw);
      height: min(520px, 68vh);
      border: 1px solid rgba(255,255,255,0.88);
      background: #000;
      box-shadow: 0 0 34px rgba(255,255,255,0.14);
      z-index: 12;
    }

    #titleBar {
      height: 30px;
      border-bottom: 1px solid rgba(255,255,255,0.7);
      display: flex;
      align-items: center;
      padding: 0 11px;
      font-size: 11px;
      letter-spacing: 0.12em;
      color: rgba(255,255,255,0.82);
      background: #050505;
    }

    #roomCanvas {
      display: block;
      width: 100%;
      height: calc(100% - 30px);
      image-rendering: pixelated;
      background: #000;
    }

    .fadeOut {
      animation: fadeOut 0.55s forwards;
    }

    @keyframes fadeOut {
      to { opacity: 0; transform: scale(1.02); }
    }

    @media (max-width: 980px) {
      #gameWindow {
        right: 5vw;
        width: 90vw;
        height: 48vh;
        top: 34%;
      }
    }
  </style>

  <link rel="stylesheet" href="./eye-transition.css" />
  <link rel="stylesheet" href="./custom-cursor.css" />
  <link rel="stylesheet" href="./david-companion.css" />
</head>
<body data-companion-voice="off">
  <div id="desktop"></div>

  <div id="gameWindow">
    <div id="titleBar">DAVID.EXE / DREAM_ROOM.exe</div>
    <canvas id="roomCanvas"></canvas>
  </div>

  <div class="davidCompanion" data-david-companion>
    <canvas class="davidCompanionCanvas"></canvas>
    <div class="dialogue">
      <div class="speaker">DAVID</div>
      <div id="dialogueText">...</div>
    </div>
  </div>

  <script src="./eye-transition.js"></script>
  <script src="./image/david-model-data.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="./david-voice.js"></script>
  <script src="./david-companion.js"></script>
  <script>
    const canvas = document.getElementById('roomCanvas');
    const ctx = canvas.getContext('2d');
    const gameWindow = document.getElementById('gameWindow');
    const dialogueText = document.getElementById('dialogueText');

    let W = 0;
    let H = 0;
    let dpr = 1;
    let frame = 0;
    let stage = 0;
    let typingTimer = null;

    // scene 04 timing: a bit slower than the other minigames on purpose
    const lines = [
      { text: 'Money?', stage: 0 },
      { text: 'I cannot believe it.', stage: 0 },
      { text: 'Besides wealth?', stage: 1 },
      { text: 'Better grades?', stage: 2 },
      { text: 'Being liked by everyone?', stage: 3 },
      { text: 'Having superpowers?', stage: 4 },
      { text: 'That is it.', stage: 5 },
      { text: 'It is fine to be a little greedy in dreams.', stage: 5 },
      { text: 'After all, reality is already restrained enough.', stage: 5 }
    ];

    function resize() {
      const rect = gameWindow.getBoundingClientRect();
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = Math.max(1, rect.width);
      H = Math.max(1, rect.height - 30);
      canvas.width = Math.floor(W * dpr);
      canvas.height = Math.floor(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function speak(text, done, pause = 520) {
      clearInterval(typingTimer);
      dialogueText.textContent = '';
      const voicePromise = window.DAVIDVoice ? window.DAVIDVoice.speak(text) : Promise.resolve();
      let index = 0;
      typingTimer = setInterval(() => {
        dialogueText.textContent = text.slice(0, index);
        index++;
        if (index > text.length) {
          clearInterval(typingTimer);
          dialogueText.textContent = text;
          if (done) {
            Promise.race([
              Promise.resolve(voicePromise),
              new Promise(resolve => setTimeout(resolve, Math.min(5200, Math.max(1000, text.length * 95))))
            ]).then(() => setTimeout(done, pause));
          }
        }
      }, Math.max(18, 34 - text.length * 0.08));
    }

    function playScene() {
      let i = 0;
      function next() {
        if (i >= lines.length) {
          setTimeout(() => {
            if (window.goWithEyeTransition) {
              window.goWithEyeTransition('SCENE03.html?from=dream-room');
            } else {
              document.body.classList.add('fadeOut');
              setTimeout(() => {
                window.location.href = 'SCENE03.html?from=dream-room';
              }, 520);
            }
          }, 900);
          return;
        }
        stage = lines[i].stage;
        speak(lines[i].text, next, 560);
        i++;
      }
      next();
    }

    function drawRoom() {
      frame++;
      ctx.fillStyle = '#030303';
      ctx.fillRect(0, 0, W, H);

      const backX = W * 0.18;
      const backY = H * 0.14;
      const backW = W * 0.64;
      const backH = H * 0.52;

      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,0.3)';
      ctx.lineWidth = 1;
      ctx.strokeRect(backX, backY, backW, backH);
      ctx.beginPath();
      ctx.moveTo(backX, backY);
      ctx.lineTo(0, 0);
      ctx.moveTo(backX + backW, backY);
      ctx.lineTo(W, 0);
      ctx.moveTo(backX, backY + backH);
      ctx.lineTo(0, H);
      ctx.moveTo(backX + backW, backY + backH);
      ctx.lineTo(W, H);
      ctx.stroke();
      ctx.restore();

      ctx.save();
      ctx.globalAlpha = 0.18;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(W * 0.52, H * 0.32, H * 0.34, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      const tvW = Math.min(W * 0.42, 320);
      const tvH = tvW * 0.62;
      const tvX = W / 2 - tvW / 2;
      const tvY = H * 0.36;

      ctx.save();
      ctx.fillStyle = '#050505';
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 3;
      ctx.fillRect(tvX, tvY, tvW, tvH);
      ctx.strokeRect(tvX, tvY, tvW, tvH);
      ctx.lineWidth = 1;
      ctx.strokeRect(tvX + 14, tvY + 12, tvW - 28, tvH - 30);
      ctx.beginPath();
      ctx.moveTo(tvX + tvW * 0.42, tvY);
      ctx.lineTo(tvX + tvW * 0.26, tvY - 42);
      ctx.moveTo(tvX + tvW * 0.58, tvY);
      ctx.lineTo(tvX + tvW * 0.74, tvY - 42);
      ctx.stroke();
      ctx.restore();

      drawTvContent(tvX + 14, tvY + 12, tvW - 28, tvH - 30);
      requestAnimationFrame(drawRoom);
    }

    function drawTvContent(x, y, w, h) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(x, y, w, h);
      ctx.clip();
      ctx.fillStyle = '#000';
      ctx.fillRect(x, y, w, h);

      if (Math.random() < 0.2) {
        ctx.fillStyle = 'rgba(255,255,255,0.16)';
        ctx.fillRect(x, y + Math.random() * h, w, 2 + Math.random() * 5);
      }

      const pulse = Math.sin(frame * 0.08) * 0.5 + 0.5; // old TV float, not physics
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = `${Math.max(30, h * 0.34)}px "Segoe UI Emoji", "Apple Color Emoji", sans-serif`;
      ctx.fillStyle = '#fff';

      if (stage <= 1) {
        ctx.fillText('🪙', x + w / 2, y + h * (0.48 + pulse * 0.06));
      } else if (stage === 2) {
        ctx.font = `${Math.max(30, h * 0.32)}px "Segoe UI Emoji", "Apple Color Emoji", sans-serif`;
        ctx.fillText('📄', x + w / 2, y + h * 0.48);
        ctx.font = `bold ${Math.max(22, h * 0.24)}px Courier New`;
        ctx.fillStyle = '#000';
        ctx.fillText('A+', x + w / 2, y + h * 0.49);
      } else if (stage === 3) {
        ctx.fillText('👑', x + w / 2, y + h * 0.48);
      } else if (stage === 4) {
        ctx.fillText('💪', x + w / 2, y + h * 0.5);
      } else {
        const flyX = x + w * (0.18 + (frame * 0.006 % 0.68));
        const flyY = y + h * (0.52 + Math.sin(frame * 0.08) * 0.14);
        ctx.font = `${Math.max(34, h * 0.34)}px "Segoe UI Emoji", "Apple Color Emoji", sans-serif`;
        ctx.fillStyle = '#fff';
        ctx.save();
ctx.translate(flyX - 26, flyY - 8);
ctx.scale(-1, 1);
ctx.fillText('🪽', 0, 0);
ctx.restore();
        ctx.fillText('🪽', flyX + 26, flyY - 8);
      }

      ctx.restore();
    }

    function drawReportCard(cx, cy, size) {
      ctx.save();
      ctx.lineWidth = Math.max(2, size * 0.04);
      ctx.fillStyle = '#000';
      ctx.strokeStyle = '#fff';
      ctx.fillRect(cx - size * 0.42, cy - size * 0.48, size * 0.84, size * 0.96);
      ctx.strokeRect(cx - size * 0.42, cy - size * 0.48, size * 0.84, size * 0.96);
      ctx.font = `${Math.max(12, size * 0.18)}px Courier New`;
      ctx.fillStyle = '#fff';
      ctx.fillText('REPORT CARD', cx, cy - size * 0.28);
      ctx.font = `bold ${Math.max(28, size * 0.46)}px Courier New`;
      ctx.fillText('A+', cx, cy + size * 0.08);
      ctx.font = `${Math.max(9, size * 0.12)}px Courier New`;
      ctx.fillText('PERFECT / PERFECT', cx, cy + size * 0.3);
      ctx.restore();
    }

    function drawCoin(cx, cy, r) {
      ctx.save();
      ctx.lineWidth = Math.max(2, r * 0.09);
      ctx.fillStyle = '#000';
      ctx.strokeStyle = '#fff';
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(cx, cy, r * 0.62, 0, Math.PI * 2);
      ctx.stroke();
      ctx.font = `${r * 0.9}px Courier New`;
      ctx.fillStyle = '#fff';
      ctx.fillText('$', cx, cy + r * 0.08);
      ctx.restore();
    }

    function drawCrown(cx, cy, size) {
      ctx.save();
      ctx.lineWidth = Math.max(2, size * 0.07);
      ctx.strokeStyle = '#fff';
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.moveTo(cx - size * 0.5, cy + size * 0.26);
      ctx.lineTo(cx - size * 0.42, cy - size * 0.22);
      ctx.lineTo(cx - size * 0.15, cy + size * 0.02);
      ctx.lineTo(cx, cy - size * 0.38);
      ctx.lineTo(cx + size * 0.15, cy + size * 0.02);
      ctx.lineTo(cx + size * 0.42, cy - size * 0.22);
      ctx.lineTo(cx + size * 0.5, cy + size * 0.26);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.strokeRect(cx - size * 0.48, cy + size * 0.25, size * 0.96, size * 0.16);
      ctx.restore();
    }

    function drawHouse(cx, cy, size) {
      ctx.save();
      ctx.lineWidth = Math.max(2, size * 0.055);
      ctx.strokeStyle = '#fff';
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.moveTo(cx - size * 0.5, cy - size * 0.06);
      ctx.lineTo(cx, cy - size * 0.48);
      ctx.lineTo(cx + size * 0.5, cy - size * 0.06);
      ctx.stroke();
      ctx.strokeRect(cx - size * 0.38, cy - size * 0.05, size * 0.76, size * 0.52);
      ctx.strokeRect(cx - size * 0.08, cy + size * 0.18, size * 0.16, size * 0.29);
      ctx.strokeRect(cx - size * 0.28, cy + size * 0.08, size * 0.14, size * 0.12);
      ctx.strokeRect(cx + size * 0.14, cy + size * 0.08, size * 0.14, size * 0.12);
      ctx.restore();
    }

    function drawWings(cx, cy, size) {
      ctx.save();
      ctx.lineWidth = Math.max(3, size * 0.1);
      ctx.strokeStyle = '#fff';
      ctx.fillStyle = '#000';
      for (const side of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(cx + side * size * 0.08, cy);
        ctx.bezierCurveTo(cx + side * size * 0.36, cy - size * 0.66, cx + side * size * 1.16, cy - size * 0.56, cx + side * size * 1.34, cy - size * 0.08);
        ctx.bezierCurveTo(cx + side * size * 0.88, cy + size * 0.22, cx + side * size * 0.34, cy + size * 0.22, cx + side * size * 0.08, cy);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        for (let i = 0; i < 5; i++) {
          ctx.beginPath();
          ctx.moveTo(cx + side * size * 0.18, cy + size * 0.01);
          ctx.lineTo(cx + side * size * (0.42 + i * 0.17), cy + size * (-0.4 + i * 0.12));
          ctx.stroke();
        }
      }
      ctx.beginPath();
      ctx.arc(cx, cy, size * 0.08, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    window.addEventListener('resize', resize);
    resize();
    requestAnimationFrame(drawRoom);
    setTimeout(playScene, 650);
  </script>
  <script src="./custom-cursor.js"></script>
</body>
</html>
